name: Deploy to Yandex Serverless Container

on:
  push:
    branches: [main, master]

env:
  CR_REGISTRY: crpp1bes63avh83rbvte
  CR_REPOSITORY: bmg
  CONTAINER_NAME: bmg-app
  SERVICE_ACCOUNT_ID: ajemoq00jglva97nqi47

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build Docker image
        run: |
          docker build --no-cache -t cr.yandex/${{ env.CR_REGISTRY }}/${{ env.CR_REPOSITORY }}:${{ github.sha }} .
          docker tag cr.yandex/${{ env.CR_REGISTRY }}/${{ env.CR_REPOSITORY }}:${{ github.sha }} cr.yandex/${{ env.CR_REGISTRY }}/${{ env.CR_REPOSITORY }}:latest

      - name: Push Docker image
        run: |
          docker push cr.yandex/${{ env.CR_REGISTRY }}/${{ env.CR_REPOSITORY }}:${{ github.sha }}
          docker push cr.yandex/${{ env.CR_REGISTRY }}/${{ env.CR_REPOSITORY }}:latest

      - name: Deploy Serverless Container
        uses: yc-actions/yc-sls-container-deploy@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          container-name: ${{ env.CONTAINER_NAME }}
          folder-id: b1g54bhp2g3klqsgpsbp
          revision-service-account-id: ${{ env.SERVICE_ACCOUNT_ID }}
          revision-cores: 1
          revision-memory: 2Gb
          revision-core-fraction: 100
          revision-concurrency: 4
          revision-image-url: cr.yandex/${{ env.CR_REGISTRY }}/${{ env.CR_REPOSITORY }}:${{ github.sha }}
          revision-execution-timeout: 120s
          revision-env: |
            NODE_ENV=production
            PORT=8080
            YDB_ENDPOINT=${{ secrets.YDB_ENDPOINT }}
            YDB_DATABASE=${{ secrets.YDB_DATABASE }}
            YDB_SA_KEY=${{ secrets.YDB_SA_KEY }}
            YANDEX_STORAGE_BUCKET_NAME=${{ secrets.YANDEX_STORAGE_BUCKET_NAME }}
            YANDEX_STORAGE_ACCESS_KEY=${{ secrets.YANDEX_STORAGE_ACCESS_KEY }}
            YANDEX_STORAGE_SECRET_KEY=${{ secrets.YANDEX_STORAGE_SECRET_KEY }}
            YANDEX_CLIENT_ID=${{ secrets.YANDEX_CLIENT_ID }}
            YANDEX_CLIENT_SECRET=${{ secrets.YANDEX_CLIENT_SECRET }}
            YOOKASSA_SHOP_ID=${{ secrets.YOOKASSA_SHOP_ID }}
            YOOKASSA_SECRET_KEY=${{ secrets.YOOKASSA_SECRET_KEY }}
            TBANK_TERMINAL_KEY=${{ secrets.TBANK_TERMINAL_KEY }}
            TBANK_SECRET_KEY=${{ secrets.TBANK_SECRET_KEY }}
            OZON_CLIENT_ID=${{ secrets.OZON_CLIENT_ID }}
            OZON_CLIENT_SECRET=${{ secrets.OZON_CLIENT_SECRET }}
            OZON_SCOPES=${{ secrets.OZON_SCOPES }}
            OZON_PAY_ACCESS_KEY=${{ secrets.OZON_PAY_ACCESS_KEY }}
            OZON_PAY_SECRET_KEY=${{ secrets.OZON_PAY_SECRET_KEY }}
            OZON_PAY_NOTIFICATION_SECRET=${{ secrets.OZON_PAY_NOTIFICATION_SECRET }}
            CDEK_ACCOUNT=${{ secrets.CDEK_ACCOUNT }}
            CDEK_SECRET=${{ secrets.CDEK_SECRET }}
            CDEK_MAPS_API_KEY=${{ secrets.CDEK_MAPS_API_KEY }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            TELEGRAM_WHOLESALE_BOT_TOKEN=${{ secrets.TELEGRAM_WHOLESALE_BOT_TOKEN }}
            TELEGRAM_WHOLESALE_CHAT_ID=${{ secrets.TELEGRAM_WHOLESALE_CHAT_ID }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            VK_USER_TOKEN=${{ secrets.VK_USER_TOKEN }}
            VK_ACTION_SECRET=${{ secrets.VK_ACTION_SECRET }}
            VK_CHAT_PEER_ID=${{ secrets.VK_CHAT_PEER_ID }}
            DADATA_API_KEY=${{ secrets.DADATA_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            GROQ_API_KEY_2=${{ secrets.GROQ_API_KEY_2 }}
            GROQ_PROXY_URL=${{ secrets.GROQ_PROXY_URL }}
            VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}
            SYNC_API_KEY=${{ secrets.SYNC_API_KEY }}
            SITE_URL=${{ secrets.SITE_URL }}
            APP_DOMAIN=${{ secrets.APP_DOMAIN }}
